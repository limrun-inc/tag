name: GHCR image

# On-demand image for a branch, tagged with the short commit SHA, so a rebased or
# patched build can be pinned in the limrun charts before it is released. The
# release workflow only publishes tagged releases to Docker Hub.
on:
  workflow_dispatch:
  push:
    branches:
      - "rebase/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/limrun-inc/tag

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Point apt at the main Ubuntu archive
        run: |
          sudo grep -rl azure.archive.ubuntu.com /etc/apt/ | xargs -r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' || true
          sudo apt-get update

      - name: Install build dependencies
        run: make install-deps

      - name: Build the static Linux binary
        run: |
          make build
          mkdir -p docker/bin/amd64
          cp tag docker/bin/amd64/tag
          ./tag --version

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: tag-linux-amd64
          path: docker/bin/amd64/tag

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
